[package]
name = "esp32sim-desktop"
version = "0.1.0"
description = "Windows desktop launcher for the esp32sim ESP32 emulator"
edition = "2021"

[lib]
name = "esp32sim_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
